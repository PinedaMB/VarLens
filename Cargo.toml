[package]
name = "varlens"
version = "1.2.0"
edition = "2021"
authors = ["Brayan Pineda <https://github.com/PinedaMB>"]
description = "Modern Linux native developer tool for JSON formatting, interactive tree exploration, PHP var_dump/print_r conversion, and AST diff comparison"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PinedaMB/VarLens"
keywords = ["json", "diff", "vardump", "gtk4", "libadwaita"]
categories = ["development-tools", "gui"]

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_12"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
sourceview5 = "0.11.2"
similar = { version = "3.2.1", features = ["inline"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
pest = "2.9.6"
pest_derive = "2.9.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "varlens"
maintainer = "Brayan Pineda <https://github.com/PinedaMB/VarLens>"
copyright = "2026 Brayan Pineda"
license-file = ["LICENSE", "4"]
depends = "$auto, libgtk-4-1 (>= 4.12), libadwaita-1-0 (>= 1.5), libgtksourceview-5-0"
section = "devel"
priority = "optional"
assets = [
    ["target/release/varlens", "usr/bin/", "755"],
    ["data/io.github.PinedaMB.VarLens.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.PinedaMB.VarLens.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/io.github.PinedaMB.VarLens.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/varlens/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/varlens", dest = "/usr/bin/varlens", mode = "755" },
    { source = "data/io.github.PinedaMB.VarLens.desktop", dest = "/usr/share/applications/io.github.PinedaMB.VarLens.desktop", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github.PinedaMB.VarLens.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.PinedaMB.VarLens.svg", mode = "644" },
    { source = "data/io.github.PinedaMB.VarLens.metainfo.xml", dest = "/usr/share/metainfo/io.github.PinedaMB.VarLens.metainfo.xml", mode = "644" },
]

