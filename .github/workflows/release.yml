name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build .deb, .rpm, and .AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4, Libadwaita & GtkSourceView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            build-essential \
            pkg-config \
            rpm \
            file \
            libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install Cargo Packaging Tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Compile Release Binary
        run: cargo build --release

      - name: Build Debian (.deb) Package
        run: cargo deb

      - name: Build RedHat (.rpm) Package
        run: cargo generate-rpm

      - name: Build AppImage (.AppImage)
        run: ./scripts/build-appimage.sh

      - name: Gather Artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp VarLens-x86_64.AppImage dist/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
